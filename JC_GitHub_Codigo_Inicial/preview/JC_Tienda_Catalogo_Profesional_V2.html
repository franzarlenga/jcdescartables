<script>
const KEY='jc_catalogo_profesional_demo_v2';const fmt=n=>Number(n).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2});const e=t=>String(t??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const allProducts=DATA.products, allGroups=DATA.groups; const bySku=Object.fromEntries(allProducts.map(p=>[p.sku,p]));
let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};
const st={view:'shop',tab:'Artículos',dept:'Todas',family:'Todas',brand:'Todas',search:'',sort:'destacados',filters:false,selectedGroup:null,selectedSku:null,presentation:'pack',qty:1,cart:[],selectedEditor:null,selectedGroupEditor:null,adminSearch:'',adminFamily:'Todas',adminBrand:'Todas',adminCategoryEdit:null,groupEdits:stored.groupEdits||{},productEdits:stored.productEdits||{},categoryEdits:stored.categoryEdits||{},orders:stored.orders||[],drawer:false,step:'cart'};
function save(){try{localStorage.setItem(KEY,JSON.stringify({groupEdits:st.groupEdits,productEdits:st.productEdits,categoryEdits:st.categoryEdits,orders:st.orders}))}catch{alert('No hay espacio para guardar localmente. Usá una imagen más pequeña.')}}
function imgFor(sku,group){let p=st.productEdits[sku]||{};return p.image||st.groupEdits[group?.id]?.image||''}
function getP(sku){return {...bySku[sku],...(st.productEdits[sku]||{})}}
function getG(g){let edit=st.groupEdits[g.id]||{};return {...g,...edit}}
function depts(){return [...new Set(allProducts.map(p=>p.department))]}
function familys(dept){return [...new Set(allProducts.filter(p=>dept==='Todas'||p.department===dept).map(p=>p.family))]}
function brands(dept,fam){return [...new Set(allProducts.filter(p=>(dept==='Todas'||p.department===dept)&&(fam==='Todas'||p.family===fam)).map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,'es'))}
function catName(x){return st.categoryEdits[x]?.title||x}
function groupVisible(g){const x=getG(g);return x.skus.some(sku=>{const p=getP(sku);return x.published&&p.stock!==null&&p.stock!==undefined&&p.stock>0&&((Number(p.pricePack)>0&&p.pack_units>1)||(Number(p.priceUnit)>0));})}
function pricedGroup(g){let prices=g.skus.flatMap(sku=>{const p=getP(sku);return [p.priceUnit,p.pricePack].filter(x=>Number(x)>0).map(Number)});return prices.length?Math.min(...prices):null}
function countReady(){return allGroups.filter(groupVisible).length}
function h(tag,cl,content){return `<${tag} class="${cl}">${content}</${tag}>`}
function render(){document.getElementById('app').innerHTML=header()+ (st.view==='shop'?shop():admin())+overlays();document.body.classList.toggle('no-scroll',!!(st.selectedGroup||st.drawer||st.selectedEditor||st.selectedGroupEditor));}
function setSearchValue(el,which){const pos=el.selectionStart||el.value.length;const scrollY=window.scrollY;if(which==='shop')st.search=el.value;else st.adminSearch=el.value;render();const fresh=document.querySelector(which==='shop'?'.catalog-search input':'.admin-controls input');if(fresh){fresh.focus({preventScroll:true});fresh.setSelectionRange(pos,pos)}window.scrollTo(0,scrollY)}
function header(){return `<div class="demo-top"><b>VISTA PREVIA</b> Catálogo local · sin cobros ni sincronización con Supabase</div><header class="header"><div class="header-inner"><a class="brandlogo" onclick="goShop()" href="javascript:void(0)">JC<span>.</span><small>SOLUCIONES DESCARTABLES</small></a><nav class="headnav"><button onclick="goShop()">Tienda</button><button onclick="chooseDept('Todas')">Catálogo completo</button><button onclick="st.view='admin';render()">Gestión del catálogo</button></nav><div class="header-end"><button onclick="goShop()" class="${st.view==='shop'?'primary':''}">Tienda</button><button onclick="st.view='admin';render()" class="${st.view==='admin'?'primary':''}">Gestión</button>${st.view==='shop'?`<button onclick="st.drawer=true;render()" aria-label="Carrito">▣ <span class="lab">Carrito</span> <span class="cartnum">${st.cart.reduce((n,i)=>n+i.qty,0)}</span></button>`:''}</div></div></header>`}
function goShop(){st.view='shop';st.selectedGroup=null;st.drawer=false;render();window.scrollTo({top:0,behavior:'instant'})}
function chooseDept(dep){st.view='shop';st.dept=dep;st.family='Todas';st.brand='Todas';st.filters=false;render();document.getElementById('catalogo')?.scrollIntoView({behavior:'smooth'})}
function chooseFamily(fam){st.family=fam;st.brand='Todas';render()}
function chooseBrand(b){st.brand=b;render()}
function visibleGroups(){let out=allGroups.map(getG).filter(g=>(st.dept==='Todas'||g.department===st.dept)&&(st.family==='Todas'||g.family===st.family)&&(st.brand==='Todas'||g.brand===st.brand)&&[g.title,g.brand,g.family,...g.skus.map(s=>bySku[s]?.name+' '+s)].join(' ').toLowerCase().includes(st.search.toLowerCase()));if(st.sort==='nombre')out.sort((a,b)=>a.title.localeCompare(b.title,'es'));if(st.sort==='precio')out.sort((a,b)=>(pricedGroup(a)??Infinity)-(pricedGroup(b)??Infinity));return out}
function shop(){let depList=depts();let counts=depList.map(d=>({name:d,count:allGroups.filter(g=>g.department===d).length,families:familys(d).length}));let show=visibleGroups();return `<div class="main"><section class="hero"><div class="hero-copy"><span class="eyebrow">JC · SOLUCIONES DESCARTABLES</span><h1>Todo lo que necesitás para tu negocio.</h1><p>Envases, bolsas, papel y descartables. Buscá por categoría, marca y medida, y elegí cómo comprar.</p><button class="button-primary" onclick="chooseDept('Todas')">Explorar catálogo <span>→</span></button><div class="hero-flags"><span>Compra por bulto o individual</span><span>Sin registro obligatorio</span></div></div><div class="hero-art"><strong>JC</strong><span>CATÁLOGO PROFESIONAL · DESCARTABLES</span></div></section><section class="section"><div class="section-title"><div><span class="eyebrow">NAVEGÁ POR RUBRO</span><h2>Comprá por categoría</h2></div><button onclick="chooseDept('Todas')">Ver todas →</button></div><div class="category-grid">${counts.map((c,i)=>`<button class="category-box" onclick="chooseDept('${e(c.name)}')"><span class="index">0${i+1}</span><span class="ico">▣</span><b>${e(catName(c.name))}</b><small>${c.families} subcategorías · ${c.count} grupos comerciales</small><span class="corner">→</span></button>`).join('')}</div></section><section class="section catalog" id="catalogo"><div class="section-title"><div><span class="eyebrow">CATÁLOGO ONLINE</span><h2>${e(st.dept==='Todas'?'Todos los productos':catName(st.dept))}</h2><p>337 SKU distribuidos en 82 grupos comerciales. Las opciones de venta se habilitan desde JC Gestión.</p></div><span class="muted" style="font-size:11px">${show.length} grupos</span></div><div class="catalog-search"><span>⌕</span><input aria-label="Buscar" placeholder="Buscar por producto, marca, medida o SKU" value="${e(st.search)}" oninput="setSearchValue(this,'shop')"><button onclick="st.search='';render()">×</button></div><div class="layout"><aside class="sidebar ${st.filters?'mobile-open':''}"><div class="side-header">Categorías y filtros <button style="float:right;border:0;background:none;font-size:10px;color:#b21e33" onclick="clearFilters()">Limpiar</button></div><div class="side-group"><strong>Rubros</strong><button class="${st.dept==='Todas'?'active':''}" onclick="chooseDept('Todas')">Todos los productos</button>${depList.map(d=>`<button class="${st.dept===d?'active':''}" onclick="chooseDept('${e(d)}')">${e(catName(d))}</button>`).join('')}</div><div class="side-group"><strong>Subcategorías</strong><button class="${st.family==='Todas'?'active':''}" onclick="chooseFamily('Todas')">Todas</button>${familys(st.dept).map(f=>`<button class="${st.family===f?'active':''}" onclick="chooseFamily('${e(f)}')">${e(catName(f))}</button>`).join('')}</div><div class="side-group"><strong>Marcas</strong><button class="${st.brand==='Todas'?'active':''}" onclick="chooseBrand('Todas')">Todas</button>${brands(st.dept,st.family).map(b=>`<button class="${st.brand===b?'active':''}" onclick="chooseBrand('${e(b)}')">${e(b)}</button>`).join('')}</div></aside><div><div class="result-top"><span><button class="mobile-filter" onclick="st.filters=!st.filters;render()">☷ Categorías y filtros</button> ${show.length} resultados</span><label>Ordenar <select onchange="st.sort=this.value;render()"><option ${st.sort==='destacados'?'selected':''} value="destacados">Destacados</option><option ${st.sort==='nombre'?'selected':''} value="nombre">Nombre</option><option ${st.sort==='precio'?'selected':''} value="precio">Menor precio</option></select></label></div><div class="product-grid">${show.map(g=>{let ready=groupVisible(g);let img=st.groupEdits[g.id]?.image||g.skus.map(s=>st.productEdits[s]?.image).find(Boolean);let price=pricedGroup(g);return `<article class="product-card"><button class="photo" onclick="openGroup(${g.id})">${img?`<img alt="${e(g.title)}" src="${img}">`:`<span class="packdraw">JC</span><span class="brandmark">${e(g.brand)}</span>`}</button><div class="product-body"><span class="meta">${e(catName(g.family))} / ${e(g.brand)}</span><h3>${e(g.title)}</h3><p>${g.skus.length} ${g.skus.length===1?'modelo disponible':'medidas o modelos'} · ${ready?'Disponible':'En preparación'}</p><div class="product-footer"><div><small>${price?'Desde':'Precio'}</small>${price?`<b>${fmt(price)}</b>`:`<b class="muted-price">A configurar</b>`}</div><button onclick="openGroup(${g.id})" aria-label="Ver ${e(g.title)}">+</button></div></div></article>`}).join('')}</div>${!show.length?'<div class="empty"><b>Sin resultados</b><p>Probá con otra categoría o buscá por SKU.</p></div>':''}</div></div></section></div><section class="how"><div class="how-inner"><span class="eyebrow">SIMPLE Y DIRECTO</span><h2>Comprá sin registrarte.</h2><div class="how-grid"><div><strong>01</strong><b>Elegí productos</b><p>Buscá por rubro, marca o medida y seleccioná la presentación.</p></div><div><strong>02</strong><b>Completá tus datos</b><p>No necesitás crear una cuenta en la tienda.</p></div><div><strong>03</strong><b>Pagá con Mercado Pago</b><p>Las cuotas estarán disponibles una vez que se active el checkout real.</p></div></div></div></section><footer class="footer"><div><div class="brandlogo">JC<span>.</span><small>SOLUCIONES DESCARTABLES</small></div><p>Todo lo necesario para tu comercio, en un solo lugar.</p></div><div><p>Vista previa: sin pagos, envíos ni stock en línea.</p><button class="button-outline" onclick="st.view='admin';render()">Entrar a JC Gestión</button></div></footer>${st.cart.length&&!st.drawer?`<button class="floating-cart" onclick="st.drawer=true;render()">◩ Ver carrito (${st.cart.reduce((n,i)=>n+i.qty,0)}) <span>${fmt(st.cart.reduce((n,i)=>n+i.qty*i.price,0))}</span></button>`:''}`}
function clearFilters(){st.dept='Todas';st.family='Todas';st.brand='Todas';st.search='';render()}
function openGroup(i){st.selectedGroup=i;let g=allGroups.find(g=>g.id===i);st.selectedSku=g.skus[0];st.presentation=getP(st.selectedSku).pack_units>1?'pack':'unit';st.qty=1;render()}
function modalGroup(){let g=getG(allGroups.find(x=>x.id===st.selectedGroup));let p=getP(st.selectedSku);let price=st.presentation==='pack'?Number(p.pricePack):Number(p.priceUnit);let conversion=st.presentation==='pack'?p.pack_units:1;let available=p.stock===null||p.stock===undefined?0:Math.floor(p.stock/conversion);let enabled=!!g.published&&price>0&&available>=st.qty;let foto=imgFor(p.sku,g);return `<div class="overlay" onclick="if(event.target===this){st.selectedGroup=null;render()}"><div class="dialog"><div class="dialog-head"><div><span class="eyebrow">DETALLE DE PRODUCTO</span><h2>${e(g.title)}</h2><p>${e(g.family)} · ${e(g.brand)}</p></div><button class="close" onclick="st.selectedGroup=null;render()">×</button></div><div class="dialog-content"><div class="detail-photo">${foto?`<img alt="${e(p.name)}" src="${foto}">`:'▣'}</div><div class="dialog-field"><strong>1 · Medida o modelo</strong><div class="variant-grid">${g.skus.map(s=>`<button class="${s===st.selectedSku?'active':''}" onclick="st.selectedSku='${s}';st.presentation=getP('${s}').pack_units>1?'pack':'unit';st.qty=1;render()">${e(getP(s).name)}</button>`).join('')}</div></div><div class="dialog-field"><strong>2 · Presentación</strong><div class="variant-options"><button class="${st.presentation==='pack'?'active':''}" ${p.pack_units<=1?'disabled':''} onclick="st.presentation='pack';st.qty=1;render()"><b>Bulto cerrado</b><small>${e(p.pack)} · ${p.pack_units} ${e(p.base_unit)}</small><em>${p.pricePack>0?fmt(p.pricePack):'Sin precio'}</em></button><button class="${st.presentation==='unit'?'active':''}" onclick="st.presentation='unit';st.qty=1;render()"><b>${p.base_unit==='rollo'?'Rollo individual':p.base_unit==='unidad'?'Unidad individual':'Por '+e(p.base_unit)}</b><small>1 ${e(p.base_unit)}</small><em>${p.priceUnit>0?fmt(p.priceUnit):'Sin precio'}</em></button></div></div><div class="dialog-field"><strong>3 · Cantidad</strong>${stepper('st.qty',st.qty,1,9999)} <small class="muted" style="margin-left:10px;font-size:11px">${p.stock===null||p.stock===undefined?'Stock sin cargar':'Disponibles: '+available}</small></div><div class="notice ${enabled?'':'warn'}">${enabled?'Artículo de demostración habilitado; el carrito es local y no genera un pedido real.':'Artículo en preparación. Para venderlo, cargá stock real, precio y habilitá su grupo desde JC Gestión.'}</div></div><div class="dialog-bottom"><div class="amount"><small>Subtotal</small><b>${price>0?fmt(price*st.qty):'A configurar'}</b></div><button class="button-primary" ${enabled?'':'disabled'} onclick="addCart()">Agregar al carrito →</button></div></div></div>`}
function stepper(path,n,min,max){return `<span class="stepper"><button onclick="setNumber('${path}',${n-1},${min},${max})" ${n<=min?'disabled':''}>−</button><input type="number" value="${n}" min="${min}" max="${max}" onchange="setNumber('${path}',this.value,${min},${max})"><button onclick="setNumber('${path}',${n+1},${min},${max})" ${n>=max?'disabled':''}>+</button></span>`}
function setNumber(path,n,min,max){let value=Math.max(min,Math.min(max,Math.trunc(Number(n)||min)));if(path==='st.qty')st.qty=value;else if(path.startsWith('cart:')){let idx=Number(path.split(':')[1]);st.cart[idx].qty=value;}else if(path==='stockDraft')window.stockDraft=value;render()}
function addCart(){let g=getG(allGroups.find(x=>x.id===st.selectedGroup));let p=getP(st.selectedSku);let price=st.presentation==='pack'?Number(p.pricePack):Number(p.priceUnit);let already=st.cart.find(x=>x.sku===p.sku&&x.presentation===st.presentation);if(already)already.qty+=st.qty;else st.cart.push({sku:p.sku,group:g.title,name:p.name,presentation:st.presentation,label:st.presentation==='pack'?p.pack:'Individual',qty:st.qty,price});st.selectedGroup=null;st.drawer=true;render()}
function cartModal(){let total=st.cart.reduce((sum,x)=>sum+x.price*x.qty,0);return `<div class="overlay drawer-wrap" onclick="if(event.target===this){st.drawer=false;render()}"><div class="drawer"><div class="dialog-head"><div><span class="eyebrow">TU COMPRA · DEMO</span><h2>Carrito (${st.cart.reduce((n,i)=>n+i.qty,0)})</h2></div><button class="close" onclick="st.drawer=false;render()">×</button></div><div class="drawer-items">${st.cart.length?st.cart.map((x,i)=>`<div class="cartline"><div><b>${e(x.group)}</b><p>${e(x.name)} · ${e(x.label)}</p><small>${x.sku}</small></div><button onclick="st.cart.splice(${i},1);render()">×</button><div class="bottom">${stepper('cart:'+i,x.qty,1,9999)}<b>${fmt(x.price*x.qty)}</b></div></div>`).join(''):'<div class="empty">Tu carrito está vacío.</div>'}</div><div class="drawer-foot"><div><b>Subtotal</b><strong>${fmt(total)}</strong></div><p class="muted" style="font-size:11px;line-height:1.6">Prueba local: sin cobros reales. El proyecto conectado utilizará Mercado Pago.</p><button class="button-primary" ${!st.cart.length?'disabled':''} onclick="alert('Vista previa: el checkout real todavía está desactivado. No se generó ningún cobro ni pedido.')">Finalizar compra (prueba) →</button></div></div></div>`}
function admin(){let stockDone=allProducts.filter(p=>getP(p.sku).stock!==undefined&&getP(p.sku).stock!==null).length;return `<div class="demo-admin"><div class="admin-container"><div class="admin-top"><div><span class="eyebrow">PANEL INTERNO · JC</span><h1>Gestión de la tienda</h1><p>Los cambios de esta vista previa se guardan solo en este navegador, no en Supabase.</p></div><button class="button-outline" onclick="goShop()">Ver tienda →</button></div><div class="admin-kpis"><div class="admin-kpi"><small>Artículos / SKU</small><strong>337</strong></div><div class="admin-kpi"><small>Grupos comerciales</small><strong>82</strong></div><div class="admin-kpi"><small>Con stock ingresado</small><strong>${stockDone}</strong></div><div class="admin-kpi"><small>Grupos listos</small><strong>${countReady()}</strong></div></div><div class="admin-tabs">${['Artículos','Categorías','Publicaciones','Pedidos'].map(t=>`<button class="${st.tab===t?'active':''}" onclick="st.tab='${t}';render()">${t}</button>`).join('')}</div><div class="admin-work">${st.tab==='Artículos'?adminProducts():st.tab==='Categorías'?adminCategories():st.tab==='Publicaciones'?adminGroups():adminOrders()}</div></div></div>`}
function adminProducts(){let rows=allProducts.filter(p=>(st.adminFamily==='Todas'||p.family===st.adminFamily)&&(st.adminBrand==='Todas'||p.brand===st.adminBrand)&&[p.name,p.sku,p.brand].join(' ').toLowerCase().includes(st.adminSearch.toLowerCase()));let limit=120;return `<div class="admin-title"><h2>Catálogo e inventario</h2><span class="tag">${rows.length} artículos</span></div><div class="admin-hint">Primero elegí familia y marca. Abrí el artículo para cargar foto, stock físico, precio individual y precio por bulto.</div><div class="admin-controls"><input aria-label="Buscar artículo" placeholder="Buscar por nombre o SKU" value="${e(st.adminSearch)}" oninput="setSearchValue(this,'admin')"><select onchange="st.adminFamily=this.value;st.adminBrand='Todas';render()"><option>Todas</option>${[...new Set(allProducts.map(p=>p.family))].map(f=>`<option ${st.adminFamily===f?'selected':''}>${e(f)}</option>`).join('')}</select><select onchange="st.adminBrand=this.value;render()"><option>Todas</option>${brands('Todas',st.adminFamily).map(b=>`<option ${st.adminBrand===b?'selected':''}>${e(b)}</option>`).join('')}</select></div>${rows.slice(0,limit).map(p=>{let d=getP(p.sku);return `<div class="admin-row"><div><b>${e(p.name)}</b><small>${e(p.sku)} · ${e(p.brand)} · ${e(p.family)}</small></div><div class="remove-mobile">${e(p.pack)}</div><div>${d.stock===undefined||d.stock===null?'<span class="tag">Sin stock</span>':`<b>${d.stock} ${e(d.base_unit)}</b>`}</div><button onclick="st.selectedEditor='${e(p.sku)}';window.stockDraft=getP('${e(p.sku)}').stock??0;render()">Editar →</button></div>`}).join('')}${rows.length>limit?`<div class="admin-hint">Mostrando ${limit} de ${rows.length}. Usá la búsqueda o filtros para encontrar los demás.</div>`:''}`}
function adminCategories(){let root=depts();return `<div class="admin-title"><h2>Categorías y subcategorías</h2><span class="tag">7 rubros · 31 familias</span></div><p class="muted" style="font-size:12px">Navegación basada en el PDF original. Podés renombrar las etiquetas visibles sin alterar SKU ni stock.</p><div class="admin-listing">${root.map(r=>`<div><div><b>${e(catName(r))}</b><small>${familys(r).map(x=>catName(x)).join(' · ')}</small></div><button class="button-outline" onclick="editCategory('${e(r)}')">Renombrar</button></div>${familys(r).map(f=>`<div style="padding-left:25px"><div><b>${e(catName(f))}</b><small>${allProducts.filter(p=>p.family===f).length} SKU</small></div><button class="button-outline" onclick="editCategory('${e(f)}')">Editar</button></div>`).join('')}`).join('')}</div>`}
function editCategory(name){let n=prompt('Nombre de categoría visible en tienda:',catName(name));if(n===null)return;if(!n.trim()){alert('Ingresá un nombre válido');return}st.categoryEdits[name]={title:n.trim()};save();render()}
function adminGroups(){let filter=st.adminSearch.toLowerCase();let gr=allGroups.map(getG).filter(g=>[g.title,g.brand,g.family].join(' ').toLowerCase().includes(filter));return `<div class="admin-title"><h2>Publicaciones comerciales</h2><span class="tag">${gr.length} grupos</span></div><div class="admin-hint">Cada publicación agrupa las medidas de una misma marca y línea. Habilitá una publicación solo cuando sus variantes tengan precios, stock y fotos correctos.</div><div class="admin-controls"><input placeholder="Buscar publicación" value="${e(st.adminSearch)}" oninput="setSearchValue(this,'admin')"/><div></div><div></div></div>${gr.map(g=>{let ready=groupVisible(g);return `<div class="admin-row"><div><b>${e(g.title)}</b><small>${e(g.brand)} · ${e(catName(g.family))} · ${g.skus.length} SKU</small></div><div class="remove-mobile">${g.published?'<span class="tag green">Habilitada</span>':'<span class="tag">Borrador</span>'}</div><div>${ready?'Lista para mostrar':'Faltan datos'}</div><button onclick="st.selectedGroupEditor=${g.id};render()">Editar →</button></div>`}).join('')}`}
function adminOrders(){return `<div class="admin-title"><h2>Pedidos online</h2></div><div class="empty"><b>Sin pedidos reales</b><p>Las compras de la tienda real se incorporan automáticamente en el ERP mediante Supabase y se verifican con Mercado Pago. Esta vista previa no cobra ni genera pedidos.</p></div>`}
function adminEditor(){let p=getP(st.selectedEditor);let x=st.productEdits[p.sku]||{};return `<div class="overlay" onclick="if(event.target===this){st.selectedEditor=null;render()}"><div class="modal2"><button class="close" style="float:right" onclick="st.selectedEditor=null;render()">×</button><span class="eyebrow">FICHA DEL ARTÍCULO</span><h2>${e(p.name)}</h2><p>${e(p.sku)} · ${e(p.brand)} · Proveedor: ${e(p.supplier)}</p><div class="notice">${e(p.pack)} = ${p.pack_units} ${e(p.base_unit)} · costo original: ${fmt(p.cost)} (solo administración).</div><label>Stock físico (${e(p.base_unit)}) ${stepper('stockDraft',window.stockDraft??0,0,1000000)}</label><label>Precio de venta por bulto ($)<input id="edPricePack" type="number" inputmode="decimal" min="0" step="0.01" value="${p.pricePack??''}" placeholder="Sin precio cargado"></label><label>Precio de venta individual ($)<input id="edPriceUnit" type="number" inputmode="decimal" min="0" step="0.01" value="${p.priceUnit??''}" placeholder="Sin precio cargado"></label><label>Fotografía del artículo <input type="file" accept="image/*" capture="environment" id="edPhoto" onchange="uploadPreviewImage(event,'product','${e(p.sku)}')"></label>${p.image?`<img alt="${e(p.name)}" src="${p.image}" class="admin-editpic"/>`:''}<button class="button-primary" onclick="saveProduct('${e(p.sku)}')">Guardar artículo</button><p>Esta es una simulación local. Al conectar Supabase, estos cambios se gestionarán desde el panel seguro.</p></div></div>`}
function saveProduct(sku){let stock=window.stockDraft??0;let prPack=document.getElementById('edPricePack').value;let prUnit=document.getElementById('edPriceUnit').value;if([prPack,prUnit].some(t=>t!==''&&(Number(t)<0||!Number.isFinite(Number(t))))){alert('Revisá precios');return};st.productEdits[sku]={...(st.productEdits[sku]||{}),stock,pricePack:prPack===''?null:Number(prPack),priceUnit:prUnit===''?null:Number(prUnit)};save();st.selectedEditor=null;render()}
function groupEditor(){let g=getG(allGroups.find(x=>x.id===st.selectedGroupEditor));return `<div class="overlay" onclick="if(event.target===this){st.selectedGroupEditor=null;render()}"><div class="modal2"><button class="close" style="float:right" onclick="st.selectedGroupEditor=null;render()">×</button><span class="eyebrow">PUBLICACIÓN COMERCIAL</span><h2>${e(g.title)}</h2><p>${e(g.brand)} · ${g.skus.length} medidas/modelos</p><label>Título visible<input id="grpTitle" value="${e(g.title)}"></label><label>Subcategoría<select id="grpFamily">${[...new Set(allProducts.map(p=>p.family))].map(f=>`<option ${f===g.family?'selected':''}>${e(f)}</option>`).join('')}</select></label><label><span>Publicación habilitada</span><select id="grpPublish"><option value="false" ${!g.published?'selected':''}>No, borrador</option><option value="true" ${g.published?'selected':''}>Sí, habilitar</option></select></label><label>Portada <input type="file" id="edCover" accept="image/*" onchange="uploadPreviewImage(event,'group',${g.id})"></label>${st.groupEdits[g.id]?.image?`<img class="admin-editpic" src="${st.groupEdits[g.id].image}" alt="Portada">`:''}<div class="notice">Publicar no inventa precios ni existencias: los SKU sin precio/stock siguen ocultos.</div><button class="button-primary" onclick="saveGroup(${g.id})">Guardar publicación</button></div></div>`}
function saveGroup(id){let g=getG(allGroups.find(x=>x.id===id));let title=document.getElementById('grpTitle').value.trim();if(!title)return alert('Escribí un título');st.groupEdits[id]={...(st.groupEdits[id]||{}),title,family:document.getElementById('grpFamily').value,published:document.getElementById('grpPublish').value==='true'};save();st.selectedGroupEditor=null;render()}
async function uploadPreviewImage(event,type,key){const file=event.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Solo imágenes JPG, PNG o WebP');if(file.size>8*1024*1024)return alert('Elegí una foto de hasta 8 MB');const image=new Image();image.onload=()=>{const scale=Math.min(1,720/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.69);if(type==='product')st.productEdits[key]={...(st.productEdits[key]||{}),image:data};else st.groupEdits[key]={...(st.groupEdits[key]||{}),image:data};save();render()};image.onerror=()=>alert('No se pudo leer la foto');image.src=URL.createObjectURL(file)}
function overlays(){return (st.selectedGroup!==null?modalGroup():'')+(st.drawer?cartModal():'')+(st.selectedEditor?adminEditor():'')+(st.selectedGroupEditor!==null?groupEditor():'')}
render();
</script></body></html>
