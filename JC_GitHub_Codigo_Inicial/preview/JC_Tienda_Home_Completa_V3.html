<script>
const KEY='jc_tienda_publica_v3_aislada';const fmt=n=>Number(n).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2});const e=t=>String(t??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const allProducts=DATA.products, allGroups=DATA.groups; const bySku=Object.fromEntries(allProducts.map(p=>[p.sku,p]));
let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};
const st={view:'shop',catalogAll:false,tab:'Inicio',dept:'Todas',family:'Todas',brand:'Todas',search:'',sort:'destacados',filters:false,selectedGroup:null,selectedSku:null,presentation:'pack',qty:1,cart:[],selectedEditor:null,selectedGroupEditor:null,adminSearch:'',adminFamily:'Todas',adminBrand:'Todas',adminCategoryEdit:null,homeEdits:stored.homeEdits||{},groupEdits:stored.groupEdits||{},productEdits:stored.productEdits||{},categoryEdits:stored.categoryEdits||{},orders:stored.orders||[],drawer:false,step:'cart'};
function save(){try{localStorage.setItem(KEY,JSON.stringify({homeEdits:st.homeEdits,groupEdits:st.groupEdits,productEdits:st.productEdits,categoryEdits:st.categoryEdits,orders:st.orders}))}catch{alert('No hay espacio para guardar localmente. Usá una imagen más pequeña.')}}
function imgFor(sku,group){let p=st.productEdits[sku]||{};return p.image||st.groupEdits[group?.id]?.image||''}
function getP(sku){return {...bySku[sku],...(st.productEdits[sku]||{})}}
function getG(g){let edit=st.groupEdits[g.id]||{};return {...g,...edit}}
function depts(){return [...new Set(allProducts.map(p=>p.department))]}
function familys(dept){return [...new Set(allProducts.filter(p=>dept==='Todas'||p.department===dept).map(p=>p.family))]}
function brands(dept,fam){return [...new Set(allProducts.filter(p=>(dept==='Todas'||p.department===dept)&&(fam==='Todas'||p.family===fam)).map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,'es'))}
function catName(x){return st.categoryEdits[x]?.title||x}
function groupVisible(g){const x=getG(g);return x.skus.some(sku=>{const p=getP(sku);return x.published&&p.stock!==null&&p.stock!==undefined&&p.stock>0&&((Number(p.pricePack)>0&&p.pack_units>1)||(Number(p.priceUnit)>0));})}
function pricedGroup(g){let prices=g.skus.flatMap(sku=>{const p=getP(sku);return [p.priceUnit,p.pricePack].filter(x=>Number(x)>0).map(Number)});return prices.length?Math.min(...prices):null}
function countReady(){return allGroups.filter(groupVisible).length}
function h(tag,cl,content){return `<${tag} class="${cl}">${content}</${tag}>`}
function render(){document.getElementById('app').innerHTML=header()+ shop()+overlays();document.body.classList.toggle('no-scroll',!!(st.selectedGroup||st.drawer||st.selectedEditor||st.selectedGroupEditor));}
function setSearchValue(el,which){const pos=el.selectionStart||el.value.length;const scrollY=window.scrollY;if(which==='shop')st.search=el.value;else st.adminSearch=el.value;render();const fresh=document.querySelector(which==='shop'?'.catalog-search input':'.admin-controls input');if(fresh){fresh.focus({preventScroll:true});fresh.setSelectionRange(pos,pos)}window.scrollTo(0,scrollY)}
function header(){return `<div class="demo-top"><b>VISTA PREVIA</b> Catálogo local · sin cobros ni sincronización con Supabase</div><header class="header"><div class="header-inner"><a class="brandlogo" onclick="goShop()" href="javascript:void(0)">JC<span>.</span><small>SOLUCIONES DESCARTABLES</small></a><nav class="headnav"><button onclick="goShop()">Tienda</button><button onclick="chooseDept('Todas')">Catálogo completo</button></nav><div class="header-end"><button onclick="goShop()" class="${st.view==='shop'?'primary':''}">Tienda</button>${st.view==='shop'?`<button onclick="st.drawer=true;render()" aria-label="Carrito">▣ <span class="lab">Carrito</span> <span class="cartnum">${st.cart.reduce((n,i)=>n+i.qty,0)}</span></button>`:''}</div></div></header>`}
function goShop(){st.catalogAll=false;st.dept='Todas';st.family='Todas';st.brand='Todas';st.search='';st.view='shop';st.selectedGroup=null;st.drawer=false;render();window.scrollTo({top:0,behavior:'instant'})}
function chooseDept(dep){st.catalogAll=true;st.view='shop';st.dept=dep;st.family='Todas';st.brand='Todas';st.filters=false;render();document.getElementById('catalogo')?.scrollIntoView({behavior:'smooth'})}
function chooseFamily(fam){st.catalogAll=true;st.family=fam;st.brand='Todas';render()}
function chooseBrand(b){st.catalogAll=true;st.brand=b;render()}
function visibleGroups(){let out=allGroups.map(getG).filter(g=>(st.dept==='Todas'||g.department===st.dept)&&(st.family==='Todas'||g.family===st.family)&&(st.brand==='Todas'||g.brand===st.brand)&&[g.title,g.brand,g.family,...g.skus.map(s=>bySku[s]?.name+' '+s)].join(' ').toLowerCase().includes(st.search.toLowerCase()));if(st.sort==='nombre')out.sort((a,b)=>a.title.localeCompare(b.title,'es'));if(st.sort==='precio')out.sort((a,b)=>(pricedGroup(a)??Infinity)-(pricedGroup(b)??Infinity));return out}

const homeDefaults={heroTitle:'Soluciones para cada negocio.',heroText:'Bolsas, envases, papel y descartables organizados para que encuentres lo que necesitás. Por unidad o por bulto cerrado.',bannerTitle:'¿Comprás para abastecer tu comercio?',bannerText:'Encontrá distintas presentaciones de compra y armá tu pedido con productos de varias categorías.',wholesaleTitle:'Tu compra, a tu medida.',wholesaleText:'Elegí la medida y la presentación de cada artículo. Comprá por unidad o aprovechá el bulto cerrado cuando necesites volumen.'};
function homeText(k){return st.homeEdits[k]||homeDefaults[k]||''}
function jumpTo(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function homeRubric(f){st.catalogAll=true;let d=allProducts.find(p=>p.family===f);if(d){st.dept=d.department;st.family=f;st.brand='Todas';st.search='';render();jumpTo('catalogo')}else chooseDept('Todas')}
function homeBrand(b){st.catalogAll=true;st.dept='Todas';st.family='Todas';st.brand=b;st.search='';render();jumpTo('catalogo')}
function homeSave(){let val={};for(let k of Object.keys(homeDefaults)){let el=document.getElementById('home-'+k);if(el)val[k]=el.value.trim()||homeDefaults[k]};st.homeEdits=val;save();alert('Contenido de la portada guardado en esta vista previa.');render()}

function shop(){let depList=depts();let counts=depList.map(d=>({name:d,count:allGroups.filter(g=>g.department===d).length,families:familys(d).length}));let show=visibleGroups();let previewLimit=!st.catalogAll&&!st.search&&st.dept==='Todas'&&st.family==='Todas'&&st.brand==='Todas';let cards=previewLimit?show.slice(0,9):show;return `<div class="main"><div class="home-notice" aria-label="Opciones de compra"><span>✓ Venta por unidad y por bulto</span><span>✓ Elegí medidas y presentaciones</span><span>✓ Compra sin registrarte</span></div>
<section class="hero home-hero"><div class="hero-copy"><span class="eyebrow">JC · SOLUCIONES DESCARTABLES</span><h1>${e(homeText('heroTitle'))}</h1><p>${e(homeText('heroText'))}</p><div class="home-hero-buttons"><button class="button-primary" onclick="chooseDept('Todas')">Comprar por categoría <span>→</span></button><button class="button-outline" onclick="jumpTo('como-comprar')">Cómo comprar</button></div><div class="hero-flags"><span>Productos para comercios</span><span>Catálogo por marca y medida</span></div></div><div class="hero-art home-visual" aria-hidden="true"><div class="home-visual-label">TU NEGOCIO, BIEN ABASTECIDO.</div><div class="home-pack home-pack-one"><b>BOLSAS</b><small>Arranque · Camiseta</small><i>JC.</i></div><div class="home-pack home-pack-two"><b>ENVASES</b><small>Bandejas · Potes</small><i>JC.</i></div><div class="home-pack home-pack-three"><b>PAPEL</b><small>Higiene · Cocina</small><i>JC.</i></div><span class="home-visual-foot">ENVASES · BOLSAS · PAPEL · DESCARTABLES</span></div></section>
<section class="home-highlights" aria-label="Beneficios de compra"><div><span class="home-highlight-icon">01</span><p><b>Elegí por rubro</b><small>Categorías y subcategorías</small></p></div><div><span class="home-highlight-icon">02</span><p><b>Medidas y variantes</b><small>Encontrá la opción exacta</small></p></div><div><span class="home-highlight-icon">03</span><p><b>Bulto o individual</b><small>Comprá según tu necesidad</small></p></div><div><span class="home-highlight-icon">04</span><p><b>Sin registro</b><small>Carrito y compra como invitado</small></p></div></section><section class="section"><div class="section-title"><div><span class="eyebrow">NAVEGÁ POR RUBRO</span><h2>Comprá por categoría</h2></div><button onclick="chooseDept('Todas')">Ver todas →</button></div><div class="category-grid">${counts.map((c,i)=>`<button class="category-box" onclick="chooseDept('${e(c.name)}')"><span class="index">0${i+1}</span><span class="ico">${["▧","▤","▣","▥","◫","▦","◇"][i%7]}</span><b>${e(catName(c.name))}</b><small>${c.families} subcategorías · ${c.count} grupos comerciales</small><span class="corner">→</span></button>`).join('')}</div></section><section class="home-feature" aria-label="Soluciones de compra"><article class="home-feature-primary"><span class="eyebrow">COMPRA COMERCIAL</span><h2>${e(homeText('bannerTitle'))}</h2><p>${e(homeText('bannerText'))}</p><button onclick="chooseDept('Todas')">Recorrer el catálogo <span>↗</span></button><div class="home-feature-abstract" aria-hidden="true"><span>JC</span></div></article><article class="home-feature-secondary"><span class="eyebrow">ENCONTRÁ LO TUYO</span><h3>Todo para gastronomía y comercios.</h3><p>Envases, bolsas y artículos para el día a día.</p><button onclick="chooseDept('Bandejas y envases')">Ver envases <span>↗</span></button><div class="home-feature-stripes" aria-hidden="true"></div></article></section>
<section class="section home-lines" id="lineas"><div class="section-title"><div><span class="eyebrow">MARCAS Y LÍNEAS</span><h2>Encontrá lo que buscás.</h2><p>Elegí una línea conocida y explorá sus medidas y presentaciones.</p></div><button onclick="chooseDept('Todas')">Explorar todo →</button></div><div class="home-line-grid"><button onclick="homeBrand('Rolan')"><span class="home-line-no">01 / BOLSAS</span><b>Rolan</b><small>Rollos de arranque · varias medidas</small><i>↗</i></button><button onclick="homeBrand('Elegante')"><span class="home-line-no">02 / PAPEL</span><b>Elegante</b><small>Higiénico, cocina y bobinas</small><i>↗</i></button><button onclick="homeRubric('Film')"><span class="home-line-no">03 / EMBALAJE</span><b>Film PVC</b><small>Rollos, anchos y longitudes</small><i>↗</i></button><button onclick="chooseDept('Bandejas y envases')"><span class="home-line-no">04 / GASTRONOMÍA</span><b>Bandejas y envases</b><small>Distintos materiales y modelos</small><i>↗</i></button></div></section>
<section class="section home-sectors"><div class="section-title"><div><span class="eyebrow">SOLUCIONES POR ACTIVIDAD</span><h2>Para tu tipo de comercio.</h2><p>Un acceso más rápido a los artículos de cada rubro.</p></div></div><div class="home-sector-grid"><button onclick="chooseDept('Bandejas y envases')"><div class="sector-icon">◒</div><b>Gastronomía</b><small>Envases, bandejas, vasos y tapas</small><span>Ver soluciones ↗</span></button><button onclick="chooseDept('Bolsas')"><div class="sector-icon">▣</div><b>Almacenes y comercios</b><small>Bolsas, rollos y embalaje</small><span>Ver soluciones ↗</span></button><button onclick="chooseDept('Film, láminas y aluminio')"><div class="sector-icon">▥</div><b>Embalaje y despacho</b><small>Film, láminas, cintas y accesorios</small><span>Ver soluciones ↗</span></button><button onclick="chooseDept('Papel y limpieza')"><div class="sector-icon">▤</div><b>Higiene y papel</b><small>Papel higiénico, cocina y servilletas</small><span>Ver soluciones ↗</span></button></div></section>
<section class="home-wholesale" id="por-mayor"><div><span class="eyebrow">COMPRÁ COMO NECESITÁS</span><h2>${e(homeText('wholesaleTitle'))}</h2><p>${e(homeText('wholesaleText'))}</p><button class="button-primary" onclick="chooseDept('Todas')">Ver productos y presentaciones →</button></div><div class="home-wholesale-options"><div><span>01</span><b>Unidad individual</b><small>Seleccioná la unidad de venta disponible de cada referencia.</small></div><div><span>02</span><b>Bulto cerrado</b><small>Consultá cuántas unidades contiene el bulto antes de comprar.</small></div><div class="home-wholesale-note">Elegí la presentación que necesites: individual o bulto cerrado.</div></div></section>
<section class="section catalog" id="catalogo"><div class="section-title"><div><span class="eyebrow">CATÁLOGO ONLINE</span><h2>${e(previewLimit?'Una selección del catálogo':st.dept==='Todas'?'Todos los productos':catName(st.dept))}</h2><p>Explorá los artículos por categoría, marca y medida. Consultá las presentaciones disponibles antes de comprar.</p></div><span class="muted" style="font-size:11px">${show.length} grupos</span></div><div class="catalog-search"><span>⌕</span><input aria-label="Buscar" placeholder="Buscar por producto, marca, medida o SKU" value="${e(st.search)}" oninput="setSearchValue(this,'shop')"><button onclick="st.search='';render()">×</button></div><div class="layout"><aside class="sidebar ${st.filters?'mobile-open':''}"><div class="side-header">Categorías y filtros <button style="float:right;border:0;background:none;font-size:10px;color:#b21e33" onclick="clearFilters()">Limpiar</button></div><div class="side-group"><strong>Rubros</strong><button class="${st.dept==='Todas'?'active':''}" onclick="chooseDept('Todas')">Todos los productos</button>${depList.map(d=>`<button class="${st.dept===d?'active':''}" onclick="chooseDept('${e(d)}')">${e(catName(d))}</button>`).join('')}</div><div class="side-group"><strong>Subcategorías</strong><button class="${st.family==='Todas'?'active':''}" onclick="chooseFamily('Todas')">Todas</button>${familys(st.dept).map(f=>`<button class="${st.family===f?'active':''}" onclick="chooseFamily('${e(f)}')">${e(catName(f))}</button>`).join('')}</div><div class="side-group"><strong>Marcas</strong><button class="${st.brand==='Todas'?'active':''}" onclick="chooseBrand('Todas')">Todas</button>${brands(st.dept,st.family).map(b=>`<button class="${st.brand===b?'active':''}" onclick="chooseBrand('${e(b)}')">${e(b)}</button>`).join('')}</div></aside><div><div class="result-top"><span><button class="mobile-filter" onclick="st.filters=!st.filters;render()">☷ Categorías y filtros</button> ${show.length} resultados</span><label>Ordenar <select onchange="st.sort=this.value;render()"><option ${st.sort==='destacados'?'selected':''} value="destacados">Destacados</option><option ${st.sort==='nombre'?'selected':''} value="nombre">Nombre</option><option ${st.sort==='precio'?'selected':''} value="precio">Menor precio</option></select></label></div><div class="product-grid">${cards.map(g=>{let ready=groupVisible(g);let img=st.groupEdits[g.id]?.image||g.skus.map(s=>st.productEdits[s]?.image).find(Boolean);let price=pricedGroup(g);return `<article class="product-card"><button class="photo" onclick="openGroup(${g.id})">${img?`<img alt="${e(g.title)}" src="${img}">`:`<span class="packdraw">JC</span><span class="brandmark">${e(g.brand)}</span>`}</button><div class="product-body"><span class="meta">${e(catName(g.family))} / ${e(g.brand)}</span><h3>${e(g.title)}</h3><p>${g.skus.length} ${g.skus.length===1?'modelo disponible':'medidas o modelos'} · ${ready?'Disponible':'En preparación'}</p><div class="product-footer"><div><small>${price?'Desde':'Precio'}</small>${price?`<b>${fmt(price)}</b>`:`<b class="muted-price">A configurar</b>`}</div><button onclick="openGroup(${g.id})" aria-label="Ver ${e(g.title)}">+</button></div></div></article>`}).join('')}</div>${previewLimit&&show.length>9?`<div class="home-view-all"><button class="button-primary" onclick="st.catalogAll=true;render();jumpTo('catalogo')">Ver catálogo completo (${show.length} grupos) →</button></div>`:''}${!show.length?'<div class="empty"><b>Sin resultados</b><p>Probá con otra categoría o buscá por SKU.</p></div>':''}</div></div></section></div><section class="how" id="como-comprar"><div class="how-inner"><span class="eyebrow">SIMPLE Y DIRECTO</span><h2>Comprá sin registrarte.</h2><div class="how-grid"><div><strong>01</strong><b>Elegí productos</b><p>Buscá por rubro, marca o medida y seleccioná la presentación.</p></div><div><strong>02</strong><b>Completá tus datos</b><p>No necesitás crear una cuenta en la tienda.</p></div><div><strong>03</strong><b>Pagá con Mercado Pago</b><p>Las cuotas estarán disponibles una vez que se active el checkout real.</p></div></div></div></section><section class="home-faq"><div class="home-faq-intro"><span class="eyebrow">AYUDA PARA COMPRAR</span><h2>Preguntas frecuentes.</h2><p>Lo principal para comprar desde la tienda JC.</p></div><div class="home-faq-items"><details><summary>¿Tengo que registrarme para comprar? <span>+</span></summary><p>No. Elegís tus productos y completás los datos de contacto y entrega al finalizar el carrito.</p></details><details><summary>¿Puedo comprar por bulto y también individual? <span>+</span></summary><p>Sí, cuando ambas presentaciones estén habilitadas. El contenido del bulto figura en cada variante.</p></details><details><summary>¿Cómo se ofrecen las cuotas? <span>+</span></summary><p>Al habilitar el checkout de Mercado Pago, verás los medios de pago y cuotas disponibles según tu tarjeta y las condiciones vigentes.</p></details><details><summary>¿Cómo se coordina la entrega? <span>+</span></summary><p>Las condiciones de entrega y su costo se confirmarán al activar los envíos de la tienda. Esta vista previa no realiza compras reales.</p></details></div></section><footer class="footer"><div><div class="brandlogo">JC<span>.</span><small>SOLUCIONES DESCARTABLES</small></div><p>Todo lo necesario para tu comercio, en un solo lugar.</p></div><div class="home-footer-links"><b>EXPLORÁ JC</b><button onclick="chooseDept('Todas')">Catálogo completo</button><button onclick="jumpTo('como-comprar')">Cómo comprar</button><button onclick="jumpTo('por-mayor')">Por unidad y bulto</button><small>Explorá el catálogo y elegí la presentación que necesites.</small></div><div><b>INFORMACIÓN</b><p>Vista previa comercial. Los pagos y las existencias en línea todavía no están habilitados.</p></div></footer>${st.cart.length&&!st.drawer?`<button class="floating-cart" onclick="st.drawer=true;render()">◩ Ver carrito (${st.cart.reduce((n,i)=>n+i.qty,0)}) <span>${fmt(st.cart.reduce((n,i)=>n+i.qty*i.price,0))}</span></button>`:''}`}
function clearFilters(){st.dept='Todas';st.family='Todas';st.brand='Todas';st.search='';render()}
function openGroup(i){st.selectedGroup=i;let g=allGroups.find(g=>g.id===i);st.selectedSku=g.skus[0];st.presentation=getP(st.selectedSku).pack_units>1?'pack':'unit';st.qty=1;render()}
function modalGroup(){let g=getG(allGroups.find(x=>x.id===st.selectedGroup));let p=getP(st.selectedSku);let price=st.presentation==='pack'?Number(p.pricePack):Number(p.priceUnit);let conversion=st.presentation==='pack'?p.pack_units:1;let available=p.stock===null||p.stock===undefined?0:Math.floor(p.stock/conversion);let enabled=!!g.published&&price>0&&available>=st.qty;let foto=imgFor(p.sku,g);return `<div class="overlay" onclick="if(event.target===this){st.selectedGroup=null;render()}"><div class="dialog"><div class="dialog-head"><div><span class="eyebrow">DETALLE DE PRODUCTO</span><h2>${e(g.title)}</h2><p>${e(g.family)} · ${e(g.brand)}</p></div><button class="close" onclick="st.selectedGroup=null;render()">×</button></div><div class="dialog-content"><div class="detail-photo">${foto?`<img alt="${e(p.name)}" src="${foto}">`:'▣'}</div><div class="dialog-field"><strong>1 · Medida o modelo</strong><div class="variant-grid">${g.skus.map(s=>`<button class="${s===st.selectedSku?'active':''}" onclick="st.selectedSku='${s}';st.presentation=getP('${s}').pack_units>1?'pack':'unit';st.qty=1;render()">${e(getP(s).name)}</button>`).join('')}</div></div><div class="dialog-field"><strong>2 · Presentación</strong><div class="variant-options"><button class="${st.presentation==='pack'?'active':''}" ${p.pack_units<=1?'disabled':''} onclick="st.presentation='pack';st.qty=1;render()"><b>Bulto cerrado</b><small>${e(p.pack)} · ${p.pack_units} ${e(p.base_unit)}</small><em>${p.pricePack>0?fmt(p.pricePack):'Sin precio'}</em></button><button class="${st.presentation==='unit'?'active':''}" onclick="st.presentation='unit';st.qty=1;render()"><b>${p.base_unit==='rollo'?'Rollo individual':p.base_unit==='unidad'?'Unidad individual':'Por '+e(p.base_unit)}</b><small>1 ${e(p.base_unit)}</small><em>${p.priceUnit>0?fmt(p.priceUnit):'Sin precio'}</em></button></div></div><div class="dialog-field"><strong>3 · Cantidad</strong>${stepper('st.qty',st.qty,1,9999)} <small class="muted" style="margin-left:10px;font-size:11px">${p.stock===null||p.stock===undefined?'Stock sin cargar':'Disponibles: '+available}</small></div><div class="notice ${enabled?'':'warn'}">${enabled?'Artículo de demostración habilitado; el carrito es local y no genera un pedido real.':'Artículo en preparación. Este artículo todavía no está disponible para comprar.'}</div></div><div class="dialog-bottom"><div class="amount"><small>Subtotal</small><b>${price>0?fmt(price*st.qty):'A configurar'}</b></div><button class="button-primary" ${enabled?'':'disabled'} onclick="addCart()">Agregar al carrito →</button></div></div></div>`}
function stepper(path,n,min,max){return `<span class="stepper"><button onclick="setNumber('${path}',${n-1},${min},${max})" ${n<=min?'disabled':''}>−</button><input type="number" value="${n}" min="${min}" max="${max}" onchange="setNumber('${path}',this.value,${min},${max})"><button onclick="setNumber('${path}',${n+1},${min},${max})" ${n>=max?'disabled':''}>+</button></span>`}
function setNumber(path,n,min,max){let value=Math.max(min,Math.min(max,Math.trunc(Number(n)||min)));if(path==='st.qty')st.qty=value;else if(path.startsWith('cart:')){let idx=Number(path.split(':')[1]);st.cart[idx].qty=value;}else if(path==='stockDraft')window.stockDraft=value;render()}
function addCart(){let g=getG(allGroups.find(x=>x.id===st.selectedGroup));let p=getP(st.selectedSku);let price=st.presentation==='pack'?Number(p.pricePack):Number(p.priceUnit);let already=st.cart.find(x=>x.sku===p.sku&&x.presentation===st.presentation);if(already)already.qty+=st.qty;else st.cart.push({sku:p.sku,group:g.title,name:p.name,presentation:st.presentation,label:st.presentation==='pack'?p.pack:'Individual',qty:st.qty,price});st.selectedGroup=null;st.drawer=true;render()}
function cartModal(){let total=st.cart.reduce((sum,x)=>sum+x.price*x.qty,0);return `<div class="overlay drawer-wrap" onclick="if(event.target===this){st.drawer=false;render()}"><div class="drawer"><div class="dialog-head"><div><span class="eyebrow">TU COMPRA · DEMO</span><h2>Carrito (${st.cart.reduce((n,i)=>n+i.qty,0)})</h2></div><button class="close" onclick="st.drawer=false;render()">×</button></div><div class="drawer-items">${st.cart.length?st.cart.map((x,i)=>`<div class="cartline"><div><b>${e(x.group)}</b><p>${e(x.name)} · ${e(x.label)}</p><small>${x.sku}</small></div><button onclick="st.cart.splice(${i},1);render()">×</button><div class="bottom">${stepper('cart:'+i,x.qty,1,9999)}<b>${fmt(x.price*x.qty)}</b></div></div>`).join(''):'<div class="empty">Tu carrito está vacío.</div>'}</div><div class="drawer-foot"><div><b>Subtotal</b><strong>${fmt(total)}</strong></div><p class="muted" style="font-size:11px;line-height:1.6">Prueba local: sin cobros reales. El proyecto conectado utilizará Mercado Pago.</p><button class="button-primary" ${!st.cart.length?'disabled':''} onclick="alert('Vista previa: el checkout real todavía está desactivado. No se generó ningún cobro ni pedido.')">Finalizar compra (prueba) →</button></div></div></div>`}
function overlays(){return (st.selectedGroup!==null?modalGroup():'')+(st.drawer?cartModal():'')}
render();
</script></body></html>
